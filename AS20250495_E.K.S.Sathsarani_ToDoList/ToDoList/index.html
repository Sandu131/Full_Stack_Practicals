<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        My To-Do List
    </nav>

    <div class="container">
        <div class="card">
            
            <div class="heading-section">
                <h1>Task Manager</h1>
                <p>Keep calm and Stay organized!</p>
            </div>

            <!-- Input and Add Button with IDs -->
            <div class="input-group">
                <input type="text" id="task-input" placeholder="Enter a new task...">
                <button type="button" id="add-task-btn">Add Task</button>
            </div>

            <!-- Task Counter with ID -->
            <div class="task-header">
                <span class="title">Your tasks</span>
                <span class="task-counter" id="task-counter">0 remaining</span>
            </div>

            <!-- Filter Buttons with Classes & Data Attributes -->
            <div class="filter-buttons">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Task List Container with ID -->
            <div class="task-list" id="task-list">
                No tasks yet. Add your first task!
            </div>

            <!-- Clear Completed Button with ID -->
            <div class="action-area">
                <button type="button" class="clear-btn" id="clear-completed-btn">Clear Completed</button>
            </div>

        </div>
    </div>

    <!-- Linked JS File -->
    <script src="script.js"></script>

</body>
</html>
